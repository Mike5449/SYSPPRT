<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nettoyage du cache et localStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #764ba2;
        }
        .success {
            color: #10b981;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 Outil de nettoyage</h2>
        <p>Cliquez sur le bouton pour nettoyer le cache et le localStorage</p>
        <button onclick="clearAll()">Nettoyer et Redémarrer</button>
        <div id="message"></div>
    </div>

    <script>
        function clearAll() {
            // Nettoyer localStorage
            localStorage.clear();
            
            // Nettoyer sessionStorage
            sessionStorage.clear();
            
            // Afficher message de succès
            document.getElementById('message').innerHTML = '<p class="success">✅ Nettoyage terminé!<br>Redirection dans 2 secondes...</p>';
            
            // Rediriger vers la page de login
            setTimeout(() => {
                window.location.href = 'http://localhost:5173/login';
            }, 2000);
        }
    </script>
</body>
</html>
